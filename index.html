
<!DOCTYPE html>
<html>
<head>
    <title>Student Registration</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gradient-to-r from-indigo-400 via-pink-400 to-indigo-400">

    <div class="max-w-md mx-auto mt-10 bg-white p-6 rounded shadow">

        <h2 class="text-3xl font-bold mb-5 text-center">
            Student Registration
        </h2>

        <form id="registrationForm">

            <!-- Name -->
            <label>Student Name</label>
            <input type="text" id="name" placeholder="Enter Name"
                class="w-full border p-2 mb-3 rounded">

            <!-- Email -->
            <label>Email</label>
            <input type="text" id="email" placeholder="Enter Email"
                class="w-full border p-2 mb-3 rounded">

            <!-- Password -->
            <label>Password</label>
            <input type="password" id="password" placeholder="Enter password"
                class="w-full border p-2 mb-3 rounded">
            <div class="text-center">
            <button type="button" id="showPassword"
                class="w-xl bg-green-500 text-white p-2 hover:scale-105 rounded">
                Show Password
            </button>
            </div>

            <!-- Mobile -->
            <label>Mobile Number</label>
            <input type="text" id="mobile" placeholder="Enter Mo. Number"
                class="w-full border p-2 mb-4 rounded">

            <button type="submit"
                class="w-full bg-blue-500 text-white p-2 hover:scale-105 transition-all duration-500 rounded">
                Register
            </button>

            <p id="message" class="mt-4 text-center"></p>

        </form>
    </div>


    <script>
        document.getElementById("showPassword").onclick = function() {

            let password = document.getElementById("password");

            if (password.type === "password") {
                password.type = "text";
                this.innerHTML = "Hide Password";
            } else {
                password.type = "password";
                this.innerHTML = "Show Password";
            }
        };

        document.getElementById("registrationForm").onsubmit = function(event) {

            event.preventDefault();

            let name = document.getElementById("name").value;
            let email = document.getElementById("email").value;
            let password = document.getElementById("password").value;
            let mobile = document.getElementById("mobile").value;

            let message = document.getElementById("message");

            let passwordPattern = /^(?=.*[A-Z])(?=.*[a-z])(?=.*[0-9])(?=.*[@]).{6,}$/;

            // Mandatory fields
            if (name == "" || email == "" || password == "" || mobile == "") {
                message.innerHTML = "Please fill all fields.";
                message.className = "mt-4 text-center text-red-500";
                return;
            }

            // Email validation
            if (!email.includes("@") || !email.includes(".")) {
                message.innerHTML = "Enter a valid email.";
                message.className = "mt-4 text-center text-red-500";
                return;
            }

            // Password validation
            if (password.length < 6) {
                message.innerHTML = "Password must be at least 6 characters.";
                message.className = "mt-4 text-center text-red-500";
                return;
            }

            if (!passwordPattern.test(password)) {
                message.innerHTML = "Password must contain uppercase, lowercase, number and @ symbol.";
                message.className = "mt-4 text-center text-red-500";
                return;
            }

            // Mobile validation
            if (mobile.length != 10 || isNaN(mobile)) {
                message.innerHTML = "Enter a valid 10-digit mobile number.";
                message.className = "mt-4 text-center text-red-500";
                return;
            }

            // Success
            message.innerHTML = "Registration Successful!";
            message.className = "mt-4 text-center text-green-500";

        };

    </script>

</body>
</html>
